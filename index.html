<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1417">
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://nevoa-apogeu-default-rtdb.firebaseio.com">
<meta name="description" content="Mesa de RPG de Névoa Sobre Apogeu: mapa, fichas e mural ao vivo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230d1417' stroke='%23e9b45a' stroke-width='4'/%3E%3Cpath d='M32 12l7 20-7 20-7-20z' fill='%23e9b45a'/%3E%3C/svg%3E">
<title>Névoa Sobre Apogeu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: mesa de mestre — lista de locais à esquerda, mapa ao centro, painel do mestre à direita.
   Visual único escuro (mar à noite), acento âmbar da lanterna do farol. */
:root {
  color-scheme: dark;
  --ink: #0d1417;
  --ink-2: #111b1f;
  --panel: #142024;
  --panel-2: #1a2a2f;
  --panel-3: #22353b;
  --line: rgba(196, 214, 216, 0.13);
  --line-2: rgba(196, 214, 216, 0.22);
  --mist: #d3dcdd;
  --mist-2: #9fb0b3;
  --mist-3: #6f8387;
  --lamp: #e9b45a;
  --lamp-2: #f3cd85;
  --lamp-ink: #2a1c06;
  --sea: #4fa3a5;
  --danger: #de6b58;
  --ok: #8cc084;
  --fog: #a9b7bb;
  --f-display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --f-ui: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--mist); font: 14px/1.4 var(--f-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { height: 100%; display: grid; grid-template-columns: 252px minmax(0, 1fr) 336px; grid-template-rows: 54px minmax(0, 1fr); grid-template-areas: "top top top" "left stage right"; }
.app.no-left { grid-template-columns: 0 minmax(0, 1fr) 336px; }
.app.no-right { grid-template-columns: 252px minmax(0, 1fr) 0; }
.app.no-left.no-right { grid-template-columns: 0 minmax(0, 1fr) 0; }

/* ---------- barra superior ---------- */
.topbar { grid-area: top; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--ink-2); border-bottom: 1px solid var(--line); min-width: 0; z-index: 30; }
.brand { display: flex; align-items: center; gap: 9px; flex: none; color: var(--mist); text-decoration: none; }
.brand svg { width: 26px; height: 26px; color: var(--lamp); }
.brand b { font: 600 19px/1 var(--f-display); letter-spacing: 0.02em; white-space: nowrap; }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; color: var(--mist-2); font-size: 13px; }
.crumbs button { background: none; border: 0; padding: 3px 4px; border-radius: 5px; color: var(--mist-2); white-space: nowrap; }
.crumbs button:hover { color: var(--mist); background: rgba(255, 255, 255, 0.05); }
.crumbs .cur { color: var(--mist); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs .sep { color: var(--mist-3); }
.top-sp { flex: 1; }
.scene-pill { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); min-width: 0; }
.scene-pill .lbl { font-size: 12px; color: var(--mist-2); white-space: nowrap; }
.scene-pill .lbl b { color: var(--mist); font-weight: 600; }
.scene-pill .eye { width: 8px; height: 8px; border-radius: 50%; background: var(--sea); box-shadow: 0 0 0 3px rgba(79, 163, 165, 0.22); flex: none; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--mist-2); cursor: pointer; white-space: nowrap; user-select: none; }
.chk input { accent-color: var(--lamp); margin: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--mist); font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover { background: var(--panel-3); border-color: rgba(196, 214, 216, 0.32); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 6px; }
.btn.primary { background: var(--lamp); color: var(--lamp-ink); border-color: var(--lamp); }
.btn.primary:hover { background: var(--lamp-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--mist-2); }
.btn.ghost:hover { color: var(--mist); background: rgba(255, 255, 255, 0.06); }
.btn.danger { color: var(--danger); border-color: rgba(222, 107, 88, 0.45); background: transparent; }
.btn.danger:hover { background: rgba(222, 107, 88, 0.12); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.iconbtn { width: 34px; height: 34px; padding: 0; display: inline-grid; place-items: center; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--mist-2); }
.iconbtn:hover { color: var(--mist); background: rgba(255, 255, 255, 0.06); }
.topbar .iconbtn { flex: none; }
.iconbtn svg { width: 18px; height: 18px; }
.only-narrow { display: none !important; }

/* ---------- laterais ---------- */
.side { background: var(--panel); min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; z-index: 20; }
.side-left { grid-area: left; border-right: 1px solid var(--line); }
.side-right { grid-area: right; border-left: 1px solid var(--line); }
.side-head { padding: 14px 16px 10px; display: flex; align-items: center; gap: 8px; }
.eyebrow { font: 600 11px/1 var(--f-ui); letter-spacing: 0.16em; text-transform: uppercase; color: var(--mist-3); }
.search { margin: 0 16px 10px; position: relative; }
.search input { width: 100%; box-sizing: border-box; height: 32px; padding: 0 10px 0 30px; border-radius: 7px; border: 1px solid var(--line); background: var(--ink-2); outline: none; }
.search input:focus { border-color: var(--lamp); }
.search svg { position: absolute; left: 9px; top: 8px; width: 15px; height: 15px; color: var(--mist-3); }
.scroll { overflow-y: auto; min-height: 0; flex: 1; scrollbar-width: thin; scrollbar-color: var(--panel-3) transparent; }
.loc-group { padding: 6px 0 8px; }
.loc-group h3 { margin: 0; padding: 8px 16px 6px; display: flex; align-items: center; gap: 8px; font: 600 11px/1 var(--f-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--mist-3); }
.loc-group h3 svg { width: 15px; height: 15px; color: var(--mist-2); }
.loc { display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; padding: 7px 16px 7px 39px; border: 0; background: none; text-align: left; color: var(--mist-2); font-size: 14px; position: relative; }
.loc:hover { background: rgba(255, 255, 255, 0.04); color: var(--mist); }
.loc.cur { color: var(--mist); background: rgba(233, 180, 90, 0.1); }
.loc.cur::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; border-radius: 0 3px 3px 0; background: var(--lamp); }
.loc .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.loc .tag { flex: none; font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; color: var(--sea); display: inline-flex; align-items: center; gap: 4px; }
.loc .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--sea); }
.loc .cnt { flex: none; font: 500 11px var(--f-mono); color: var(--mist-3); }
.side-foot { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 8px; }

/* ---------- palco do mapa ---------- */
.stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #16252a 0%, #0b1114 70%); }
.viewport { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; outline: none; }
.viewport.panning { cursor: grabbing; }
.viewport[data-tool="fog-reveal"], .viewport[data-tool="fog-hide"], .viewport[data-tool="measure"], .viewport[data-tool="ping"], .viewport[data-tool="areas"] { cursor: crosshair; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.world.fading { transition: opacity 0.28s ease; }
.world > * { position: absolute; left: 0; top: 0; }
.world img.map { display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; image-rendering: auto; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); }
.world svg { overflow: visible; pointer-events: none; }
.world canvas.fog { pointer-events: none; }
.labels text { font-family: var(--f-display); font-weight: 600; fill: #f6ecd2; stroke: rgba(18, 14, 10, 0.8); paint-order: stroke; stroke-linejoin: round; text-anchor: middle; dominant-baseline: middle; }
.labels text.street, .labels text.water { font-style: italic; fill: #efe6cf; }
.labels text.water { fill: #e2f2f2; }
.grid line { stroke: rgba(15, 12, 9, 0.42); stroke-width: 1; vector-effect: non-scaling-stroke; }

/* áreas clicáveis */
.hotspots .hs { pointer-events: auto; cursor: pointer; }
.hotspots .hs polygon { fill: rgba(233, 180, 90, 0); stroke: rgba(233, 180, 90, 0); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; transition: fill 0.15s, stroke 0.15s; }
.hotspots.outline .hs polygon { stroke: rgba(233, 180, 90, 0.38); stroke-dasharray: 6 5; }
.hotspots .hs:hover polygon, .hotspots .hs.hover polygon { fill: rgba(233, 180, 90, 0.16); stroke: rgba(243, 205, 133, 0.95); stroke-dasharray: none; filter: drop-shadow(0 0 6px rgba(233, 180, 90, 0.7)); }
.hotspots .dim { fill: rgba(5, 9, 11, 0.42); opacity: 0; transition: opacity 0.2s; }
.hotspots.dimming .dim { opacity: 1; }
.hotspots.editing .hs polygon { fill: rgba(79, 163, 165, 0.14); stroke: rgba(120, 210, 210, 0.9); stroke-dasharray: none; }
.hotspots.editing .hs.sel polygon { fill: rgba(233, 180, 90, 0.18); stroke: var(--lamp); }
.hotspots .handle { pointer-events: auto; cursor: move; fill: var(--lamp); stroke: #1a1206; vector-effect: non-scaling-stroke; stroke-width: 1.5; }
.hotspots .hlabel { font: 600 14px var(--f-ui); fill: #fff; stroke: rgba(0, 0, 0, 0.7); stroke-width: 3; paint-order: stroke; text-anchor: middle; }
.fx .measure line { stroke: var(--lamp); stroke-width: 2.5; vector-effect: non-scaling-stroke; stroke-dasharray: 8 6; }
.fx .measure circle { fill: var(--lamp); }
.fx .brush { fill: rgba(233, 180, 90, 0.08); stroke: rgba(243, 205, 133, 0.9); stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-dasharray: 5 4; }
.fx .brush.hide { fill: rgba(169, 183, 187, 0.12); stroke: rgba(210, 222, 225, 0.9); }
.fx .selrect { fill: rgba(233, 180, 90, 0.1); stroke: var(--lamp); stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-dasharray: 6 4; }
.fx .ping circle { fill: none; stroke: var(--lamp); vector-effect: non-scaling-stroke; }

/* fichas (tokens) */
.tokens { pointer-events: none; }
.tok { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: grab; touch-action: none; }
.tok.dragging { cursor: grabbing; z-index: 5; }
.tok .disc { width: 100%; height: 100%; border-radius: 50%; box-sizing: border-box; border: max(3px, 7%) solid var(--c); background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 55%, #ffffff), color-mix(in srgb, var(--c) 70%, #000000)); display: grid; place-items: center; overflow: hidden; box-shadow: 0 0 0 1.5px rgba(10, 8, 6, 0.85), 0 6px 14px rgba(0, 0, 0, 0.5); }
.tok .disc img { width: 100%; height: 100%; object-fit: cover; }
.tok .ini { font: 700 calc(var(--s) * 0.36px) / 1 var(--f-ui); color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); letter-spacing: 0.02em; }
.tok .name { position: absolute; left: 50%; top: 100%; margin-top: 3px; transform: translateX(-50%) scale(var(--iz, 1)); transform-origin: 50% 0; white-space: nowrap; font: 600 12px/1 var(--f-ui); color: #fff; background: rgba(8, 12, 14, 0.78); padding: 3px 6px; border-radius: 4px; pointer-events: none; }
.tok.sel .disc { box-shadow: 0 0 0 2px #fff, 0 0 0 5px var(--lamp), 0 6px 14px rgba(0, 0, 0, 0.5); }
.tok.hidden-tok { opacity: 0.55; }
.tok.hidden-tok .disc { border-style: dashed; }
.tok .kind { position: absolute; right: -2px; top: -2px; width: 30%; height: 30%; min-width: 9px; min-height: 9px; border-radius: 50%; border: 1.5px solid #0b0f11; }
.tok .kind.inimigo { background: var(--danger); }
.tok .kind.npc { background: #9fb0b3; }
.players .tok { cursor: default; }
.players .tok.mine { cursor: grab; }
.players .tok.mine .disc { box-shadow: 0 0 0 2px var(--lamp), 0 4px 14px rgba(0,0,0,.5); }
.players .tok.mine.dragging { cursor: grabbing; }
.pl-lock { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 12; display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: rgba(17, 27, 31, 0.92); border: 1px solid var(--line-2); color: var(--mist); font: 500 13px/1.2 var(--f-ui); box-shadow: var(--shadow); pointer-events: none; white-space: nowrap; }
.pl-lock svg { width: 16px; height: 16px; color: var(--lamp); flex: none; }
#lock-top.on { color: var(--lamp); background: rgba(233, 180, 90, 0.14); }
.lockcard .kv { margin: 2px 0; }
.npcrow .btn { flex: none; }

/* barra de ferramentas */
.toolbar { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 2px; padding: 4px; background: rgba(17, 27, 31, 0.92); border: 1px solid var(--line); border-radius: 11px; box-shadow: var(--shadow); z-index: 10; backdrop-filter: blur(6px); }
.toolbar .sep { height: 1px; background: var(--line); margin: 3px 4px; }
.tool { width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--mist-2); position: relative; }
.tool svg { width: 20px; height: 20px; }
.tool:hover { color: var(--mist); background: rgba(255, 255, 255, 0.07); }
.tool.on { color: var(--lamp-ink); background: var(--lamp); }
.tool .tip { position: absolute; left: 46px; top: 50%; transform: translateY(-50%); white-space: nowrap; background: #0a1013; color: var(--mist); font-size: 12px; font-weight: 600; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); opacity: 0; pointer-events: none; transition: opacity 0.12s; }
.tool .tip kbd { font: 500 11px var(--f-mono); color: var(--mist-3); margin-left: 6px; }
.tool:hover .tip, .tool:focus-visible .tip { opacity: 1; }
.subbar { position: absolute; left: 64px; top: 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; max-width: calc(100% - 140px); padding: 7px 10px; background: rgba(17, 27, 31, 0.94); border: 1px solid var(--line); border-radius: 11px; box-shadow: var(--shadow); z-index: 10; font-size: 13px; backdrop-filter: blur(6px); }
.subbar .lbl { color: var(--mist-2); font-size: 12px; white-space: nowrap; }
.subbar input[type="range"] { width: 110px; accent-color: var(--lamp); }

/* ---------- luz e clima ---------- */
.viewport[data-tool="light"] { cursor: crosshair; }
.world canvas.mist, .world canvas.night { pointer-events: none; }
.lmarks { pointer-events: none; }
.lmarks .lm-r { fill: color-mix(in srgb, var(--lc) 7%, transparent); stroke: color-mix(in srgb, var(--lc) 75%, transparent); stroke-width: 1.5; stroke-dasharray: 7 6; vector-effect: non-scaling-stroke; }
.lmarks .off .lm-r { fill: none; stroke: rgba(170, 182, 186, 0.35); }
.lmarks .lm-h { pointer-events: auto; cursor: pointer; fill: #1b2225; stroke: var(--lc); stroke-width: 2; vector-effect: non-scaling-stroke; }
.lmarks .off .lm-h { stroke: #6f8387; }
.lmarks .lm-c { pointer-events: none; fill: var(--lc); }
.lmarks .off .lm-c { fill: #3a4448; }
.lmarks .sel .lm-h { stroke: #fff; stroke-width: 3; }
.lmarks .lm-t { fill: none; stroke: rgba(255, 230, 176, 0.55); stroke-width: 1.2; stroke-dasharray: 3 5; vector-effect: non-scaling-stroke; }
.subbar .swatch { width: 20px; height: 20px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 0 10px; height: 26px; font-size: 12px; font-weight: 600; color: var(--mist-2); }
.seg button.on { background: var(--panel-3); color: var(--mist); }
.zoomctl { position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 2px; padding: 3px; background: rgba(17, 27, 31, 0.92); border: 1px solid var(--line); border-radius: 10px; z-index: 10; }
.zoomctl .pct { font: 500 12px var(--f-mono); color: var(--mist-2); width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
.zoomctl .iconbtn { width: 30px; height: 30px; }

.hoverchip { position: absolute; z-index: 12; pointer-events: none; padding: 7px 11px 8px; border-radius: 9px; background: rgba(10, 16, 19, 0.94); border: 1px solid rgba(233, 180, 90, 0.5); box-shadow: var(--shadow); transform: translate(14px, 14px); max-width: 260px; }
.hoverchip b { display: block; font: 600 19px/1.1 var(--f-display); color: var(--mist); }
.hoverchip span { display: block; margin-top: 3px; font-size: 12px; color: var(--mist-2); }
.hoverchip em { display: block; margin-top: 5px; font-style: normal; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--lamp); }

.titlecard { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); text-align: center; pointer-events: none; z-index: 11; opacity: 0; transition: opacity 0.5s ease, transform 0.6s ease; }
.titlecard.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
.titlecard .ov { font: 600 12px/1 var(--f-ui); letter-spacing: 0.32em; text-transform: uppercase; color: var(--lamp); text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9); }
.titlecard h2 { margin: 8px 0 0; font: 600 clamp(36px, 6vw, 72px)/1 var(--f-display); color: #f4ecd8; text-shadow: 0 4px 28px rgba(0, 0, 0, 0.95), 0 1px 3px rgba(0, 0, 0, 0.9); text-wrap: balance; }
.titlecard p { margin: 10px auto 0; max-width: 46ch; font: 500 italic 18px/1.35 var(--f-display); color: #dfe7e7; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95); }

.loader { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 999px; background: rgba(10, 16, 19, 0.9); border: 1px solid var(--line); font-size: 13px; color: var(--mist-2); z-index: 12; }
.loader i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--lamp); border-right-color: transparent; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.toasts { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); display: flex; flex-direction: column-reverse; align-items: center; gap: 8px; z-index: 13; pointer-events: none; width: min(92%, 420px); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 11px; background: rgba(10, 16, 19, 0.95); border: 1px solid var(--line-2); box-shadow: var(--shadow); font-size: 13px; animation: toastIn 0.25s ease; max-width: 100%; box-sizing: border-box; }
.toast.err { border-color: rgba(222, 107, 88, 0.6); }
.toast.roll .tot { font: 600 34px/1 var(--f-mono); color: var(--lamp); font-variant-numeric: tabular-nums; }
.toast.roll .ex { font: 500 12px var(--f-mono); color: var(--mist-2); }
.toast.roll .why { font-weight: 600; color: var(--mist); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }

/* ---------- painel direito ---------- */
.tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: none; padding: 9px 4px 10px; font-size: 13px; font-weight: 600; color: var(--mist-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button:hover { color: var(--mist-2); }
.tabs button.on { color: var(--mist); border-bottom-color: var(--lamp); }
.pane { padding: 14px 16px 22px; display: flex; flex-direction: column; gap: 16px; }
.pane h4 { margin: 0; font: 600 11px/1 var(--f-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--mist-3); display: flex; align-items: center; gap: 8px; }
.pane h4 .sp { flex: 1; }
.loc-title { font: 600 26px/1.05 var(--f-display); margin: 0; text-wrap: balance; }
.loc-blurb { margin: 6px 0 0; color: var(--mist-2); font-size: 13px; line-height: 1.5; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: 12px; color: var(--mist-2); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > * { min-width: 0; }

.init-row { display: grid; grid-template-columns: auto 1fr 56px auto; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--ink-2); }
.init-row.cur { border-color: var(--lamp); box-shadow: inset 3px 0 0 var(--lamp); }
.init-row .nm { min-width: 0; font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.init-row .nm small { display: block; font-weight: 400; font-size: 11px; color: var(--mist-3); }
.init-row .init-v { height: 28px; padding: 0 6px; text-align: center; font-family: var(--f-mono); }
.init-btns { display: flex; }
.init-btns .iconbtn { width: 26px; height: 26px; }
.init-btns .iconbtn svg { width: 14px; height: 14px; }
.init-btns .iconbtn[disabled] { opacity: 0.3; }

/* ---------- clima, data e rolagens ---------- */
.wx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
.cal-chip { position: absolute; left: 12px; bottom: 12px; z-index: 13; display: flex; flex-direction: column; gap: 2px; padding: 9px 14px 10px; border-radius: 12px; background: rgba(17, 27, 31, 0.9); border: 1px solid var(--line-2); box-shadow: var(--shadow); backdrop-filter: blur(6px); pointer-events: none; max-width: calc(100% - 140px); }
.cal-chip .cal-d { display: flex; align-items: center; gap: 7px; font: 600 16px/1.2 var(--f-display); color: #f4ecd8; }
.cal-chip .cal-d svg { width: 15px; height: 15px; color: var(--lamp); flex: none; }
.cal-chip .cal-w { font-size: 12px; color: var(--mist-2); padding-left: 22px; }
.app.sheets-open .cal-chip, .app.sheets-open .init-float { display: none !important; }
.cal-edit { display: grid; grid-template-columns: 64px 1fr 84px; gap: 8px; }
.sm-sel { height: 28px; width: auto; padding: 0 6px; font-size: 12.5px; }
.toast.roll .tot.sep { font-size: 22px; letter-spacing: 0.02em; display: flex; flex-direction: column; gap: 2px; }
.toast.roll .tot small, .rollrow .tot small, .sh-log .tot small { font: 500 12px var(--f-mono); color: var(--mist-2); }
.toast.roll .det { font: 500 12px var(--f-mono); color: var(--mist); margin-top: 3px; }
.toast.roll .det .drop, .sh-log .det .drop { text-decoration: line-through; opacity: 0.5; }
.toast.roll .det .crit, .sh-log .det .crit { color: var(--ok); font-weight: 700; }
.toast.roll .det .fail, .sh-log .det .fail { color: var(--danger); font-weight: 700; }
.rollrow .tot.sep { font-size: 15px; }
.sh-log .tot.sep { font-size: 15px; }
.sh-log .det { font-family: var(--f-mono); }
.sh-sepg button { font-size: 12px; }
#mp-clima { flex-wrap: wrap; height: auto; }
#mp-clima button { flex: 1 0 auto; }
/* ---------- abertura ---------- */
.ab { position: fixed; inset: 0; z-index: 90; background: #050809; overflow: hidden; color: #eef1ef; animation: ab-fadein .5s ease both; user-select: none; }
.ab.ab-out { animation: ab-fadeout .6s ease both; }
@keyframes ab-fadein { from { opacity: 0; } }
@keyframes ab-fadeout { to { opacity: 0; } }
.ab-fx { position: absolute; inset: 0; width: 100%; height: 100%; }
.ab-vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.62) 100%); }
.ab-vig::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; opacity: .5; }
.ab-flash { position: absolute; inset: 0; pointer-events: none; background: #fff; opacity: 0; }
.ab-flash.go { animation: ab-flash .32s ease-out; }
@keyframes ab-flash { 0% { opacity: .75; } 100% { opacity: 0; } }
.ab-stage { position: absolute; inset: 0; }
.ab-ctl { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 8px; z-index: 3; opacity: .55; transition: opacity .2s; }
.ab-ctl:hover, .ab-ctl:focus-within { opacity: 1; }
.ab-ctl .btn { background: rgba(5, 8, 9, .55); backdrop-filter: blur(4px); }
.ab-tap { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 3; display: inline-flex; gap: 8px; align-items: center; border: 1px solid rgba(255,255,255,.25); background: rgba(5,8,9,.7); color: #fff; border-radius: 999px; padding: 10px 16px; font: 600 14px var(--f-ui); cursor: pointer; animation: ab-pulse 1.6s ease-in-out infinite; }
.ab-tap svg { width: 18px; height: 18px; }
@keyframes ab-pulse { 50% { box-shadow: 0 0 0 8px rgba(233,180,90,.18); } }
.ab-ch { display: inline-block; animation: ab-up .55s cubic-bezier(.2,.9,.25,1.15) both; }
@keyframes ab-up { from { transform: translateY(105%) rotate(7deg); opacity: 0; } }

/* abertura: frase datilografada */
.ab-intro { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 0 24px; gap: 18px; }
.ab-eyebrow { font: 500 12px/1 var(--f-mono); letter-spacing: .5em; text-transform: uppercase; color: rgba(233,180,90,.85); animation: ab-fadein 1.2s .1s ease both; }
.ab-type { font: italic 500 clamp(24px, 4.2vw, 52px)/1.2 var(--f-display); color: #e8eeec; max-width: 22ch; margin: 0 auto; text-shadow: 0 2px 30px rgba(0,0,0,.6); }
.ab-tw .ab-ch { animation: ab-type .12s linear both; }
@keyframes ab-type { from { opacity: 0; } to { opacity: 1; } }
.ab-intro::after { content: ""; position: absolute; left: 50%; bottom: 18%; width: 1px; height: 0; background: rgba(233,180,90,.7); animation: ab-line 3s 1s ease forwards; }
@keyframes ab-line { to { height: 14vh; } }

/* cartão do personagem */
.ab-card { position: absolute; inset: 0; animation: ab-cardout .3s calc(4.8s - .3s) ease-in both; }
@keyframes ab-cardout { to { transform: scale(1.06) skewX(-3deg); filter: blur(6px) brightness(1.6); opacity: 0; } }
.ab-mq { position: absolute; left: 0; white-space: nowrap; font: 400 clamp(90px, 19vh, 220px)/1 "Anton", "Barlow", sans-serif; color: transparent; -webkit-text-stroke: 1.5px var(--txt); opacity: .13; pointer-events: none; }
.ab-mq span { display: inline-block; }
.ab-mq.m1 { top: 4vh; } .ab-mq.m1 span { animation: ab-mqL 4.8s linear both; }
.ab-mq.m2 { bottom: 2vh; opacity: .09; } .ab-mq.m2 span { animation: ab-mqR 4.8s linear both; }
@keyframes ab-mqL { from { transform: translateX(0); } to { transform: translateX(-28%); } }
@keyframes ab-mqR { from { transform: translateX(-30%); } to { transform: translateX(-2%); } }
.ab-num { position: absolute; top: 6vh; font: 400 clamp(70px, 14vh, 160px)/1 "Anton", "Barlow", sans-serif; color: var(--acc); opacity: .9; animation: ab-num .7s .1s cubic-bezier(.2,.9,.3,1) both; text-shadow: 0 0 40px rgba(0,0,0,.35); }
@keyframes ab-num { from { transform: translateY(-40%); opacity: 0; } }
.ab-L .ab-num { right: 5vw; } .ab-R .ab-num { left: 5vw; }
.ab-por { position: absolute; top: 50%; width: min(40vw, 62vh); aspect-ratio: 4 / 5; transform: translateY(-50%); }
.ab-L .ab-por { left: 7vw; } .ab-R .ab-por { right: 7vw; }
.ab-por-sh { position: absolute; inset: 0; background: var(--acc); transform: translate(18px, 18px); clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%); animation: ab-wipe .55s .12s cubic-bezier(.7,0,.2,1) both; opacity: .9; }
.ab-R .ab-por-sh { transform: translate(-18px, 18px); }
.ab-por-in { position: absolute; inset: 0; overflow: hidden; clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%); animation: ab-wipe .6s cubic-bezier(.7,0,.2,1) both; background: var(--bg0); }
@keyframes ab-wipe { from { clip-path: polygon(8% 0, 8% 0, 0 100%, 0 100%); } }
.ab-por-in img { width: 100%; height: 100%; object-fit: cover; display: block; animation: ab-ken 4.8s ease-out both, ab-glitch .4s .05s steps(2) both; }
@keyframes ab-ken { from { transform: scale(1.16); } to { transform: scale(1.02); } }
@keyframes ab-glitch { 0% { filter: hue-rotate(80deg) saturate(2); translate: 8px 0; } 50% { filter: hue-rotate(-60deg) contrast(1.4); translate: -6px 0; } 100% { filter: none; translate: 0 0; } }
.ab-ini { width: 100%; height: 100%; display: grid; place-items: center; font: 400 clamp(80px, 22vh, 240px)/1 "Anton", sans-serif; color: rgba(255,255,255,.92); text-shadow: 0 6px 40px rgba(0,0,0,.4); animation: ab-ken 4.8s ease-out both; }
.ab-por::after { content: ""; position: absolute; inset: 0; clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%); background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.45)); pointer-events: none; }
.ab-txt { position: absolute; top: 50%; transform: translateY(-50%); width: min(46vw, 760px); display: flex; flex-direction: column; gap: 14px; }
.ab-L .ab-txt { right: 6vw; text-align: right; align-items: flex-end; } .ab-R .ab-txt { left: 6vw; }
.ab-tag { display: inline-flex; align-items: center; gap: 12px; font: 500 clamp(12px, 1.5vw, 16px)/1 var(--f-mono); letter-spacing: .32em; text-transform: uppercase; color: var(--txt); animation: ab-slide .6s .2s ease both; }
.ab-tag::before { content: ""; width: 42px; height: 3px; background: var(--acc); }
.ab-L .ab-tag { flex-direction: row-reverse; }
@keyframes ab-slide { from { transform: translateX(-30px); opacity: 0; } }
.ab-L .ab-tag { animation-name: ab-slideR; } @keyframes ab-slideR { from { transform: translateX(30px); opacity: 0; } }
.ab-nm { margin: 0; display: flex; flex-direction: column; line-height: .9; }
.ab-nm .ab-f, .ab-nm .ab-l { overflow: hidden; padding-bottom: .04em; white-space: nowrap; }
.ab-nm .ab-f { font: 400 clamp(48px, calc(min(46vw, 760px) / (var(--len) * 0.62)), 160px)/0.95 "Anton", "Barlow", sans-serif; text-transform: uppercase; color: var(--txt); text-shadow: 0.05em 0.05em 0 var(--acc); letter-spacing: .01em; }
.ab-nm .ab-l { font: 400 clamp(26px, 4.4vw, 60px)/1 "Anton", "Barlow", sans-serif; text-transform: uppercase; color: var(--acc); letter-spacing: .14em; margin-top: 6px; }
.ab-fr { margin: 6px 0 0; font: italic 500 clamp(18px, 2.3vw, 30px)/1.25 var(--f-display); color: var(--txt); max-width: 30ch; animation: ab-fadein .8s 1.5s ease both; text-shadow: 0 2px 18px rgba(0,0,0,.5); }
.ab-by { font: 500 clamp(11px, 1.2vw, 14px)/1 var(--f-mono); letter-spacing: .26em; text-transform: uppercase; color: var(--txt); opacity: .75; animation: ab-fadein .8s 2.1s ease both; }
.ab-by b { color: var(--acc); font-weight: 600; }

/* título final */
.ab-title { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 0 20px; gap: 18px; }
.ab-tt { margin: 0; font: 700 clamp(38px, 8.5vw, 128px)/1 var(--f-display); text-transform: uppercase; letter-spacing: .1em; color: #f1f4f2; display: flex; flex-wrap: wrap; justify-content: center; gap: 0 .45em; text-shadow: 0 4px 50px rgba(0,0,0,.6), 0 0 30px rgba(233,180,90,.25); animation: ab-breath 7.2s ease-out both; }
@keyframes ab-breath { from { letter-spacing: .02em; } to { letter-spacing: .14em; } }
.ab-tw2 .ab-ch { animation: ab-blur 1.2s ease both; }
@keyframes ab-blur { from { opacity: 0; filter: blur(14px); transform: scale(1.4); } }
.ab-rule { width: 0; height: 2px; margin: 0 auto; background: var(--lamp); animation: ab-rule 1.4s 1.6s ease forwards; }
@keyframes ab-rule { to { width: min(320px, 50vw); } }
.ab-ts { margin: 0; font: 500 clamp(12px, 1.5vw, 16px)/1 var(--f-mono); letter-spacing: .5em; text-transform: uppercase; color: rgba(233,180,90,.9); animation: ab-fadein 1.2s 2.2s ease both; }

/* celular em pé: retrato em cima, texto embaixo */
@media (max-aspect-ratio: 1/1) {
  .ab-por { top: 8vh; transform: none; width: min(66vw, 42vh); left: 50% !important; right: auto !important; margin-left: calc(min(66vw, 42vh) / -2); }
  .ab-txt { top: auto; bottom: 9vh; transform: none; left: 7vw !important; right: 7vw !important; width: auto; text-align: center !important; align-items: center !important; }
  .ab-L .ab-tag { flex-direction: row; }
  .ab-num { top: 3vh; font-size: 11vh; }
  .ab-mq { font-size: 15vh; }
  .ab-nm .ab-f { font-size: clamp(44px, calc(88vw / var(--len) * 1.05), 120px); }
}
.ab-calm .ab-ch, .ab-calm .ab-por-in img, .ab-calm .ab-ini, .ab-calm .ab-mq span, .ab-calm .ab-tt { animation-duration: .01s !important; }
.ab-calm .ab-flash.go { animation: none; }

/* janela do mestre */
.ab-cfg { display: flex; flex-direction: column; gap: 12px; }
.ab-cfg .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .ab-cfg .grid2 { grid-template-columns: 1fr; } }
.ab-cfg h4 { margin: 6px 0 0; }
.ab-list { display: flex; flex-direction: column; gap: 8px; }
.ab-row { display: grid; grid-template-columns: auto auto 1fr auto; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); }
.ab-row.off { opacity: .5; }
.ab-row .sh-av { width: 38px; height: 38px; }
.ab-row .sh-av img { width: 100%; height: 100%; object-fit: cover; }
.ab-rw { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ab-rw .inp { width: 100%; }
.ab-mv { display: flex; flex-direction: column; gap: 4px; }
.ab-mv .iconbtn { width: 30px; height: 26px; font-size: 14px; }
.ab-mv .iconbtn:disabled { opacity: .3; }
#ab-top.off { opacity: .45; }

/* ---------- crises de estresse ---------- */
.crise-stack { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 58; display: flex; flex-direction: column; gap: 8px; width: min(340px, calc(100vw - 32px)); }
.crise-card { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(17, 27, 31, 0.97); border: 1px solid var(--c); box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.5), 0 0 24px color-mix(in srgb, var(--c) 35%, transparent); animation: crise-in .4s cubic-bezier(.2,.9,.3,1.2) both, crise-glow 1.6s ease-in-out infinite; }
.crise-card .sh-av { width: 38px; height: 38px; }
.crise-card.note { animation: crise-in .4s cubic-bezier(.2,.9,.3,1.2) both; }
.crise-ic { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 20%, transparent); color: var(--c); }
.crise-ic svg { width: 20px; height: 20px; }
.crise-card .sh-av img, .crise-head .sh-av img, .crise-note .sh-av img { width: 100%; height: 100%; object-fit: cover; }
.crise-tx { display: flex; flex-direction: column; min-width: 0; font-size: 13px; color: var(--mist-2); }
.crise-tx b { color: var(--mist); font-size: 14px; }
.crise-tx span { color: var(--c); }
@keyframes crise-in { from { transform: translateX(30px); opacity: 0; } }
@keyframes crise-glow { 50% { box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.5), 0 0 36px color-mix(in srgb, var(--c) 60%, transparent); } }
.crise-m { display: flex; flex-direction: column; gap: 12px; }
.crise-head { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 10px; background: color-mix(in srgb, var(--c) 12%, var(--panel-2)); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); }
.crise-head .sh-av { width: 46px; height: 46px; }
.crise-head div { display: flex; flex-direction: column; }
.crise-head span { color: var(--c); font-size: 13.5px; }
.crise-pick summary { cursor: pointer; color: var(--mist-2); font-size: 13.5px; }
.crise-rows { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.crise-rows .btn { justify-content: flex-start; text-align: left; }
.crise-res { padding: 14px; border-radius: 12px; border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 10%, var(--panel-2)); }
.crise-res h3 { margin: 4px 0 6px; font: 600 26px/1.1 var(--f-display); color: var(--c); }
.crise-res p { margin: 0; }
.crise-note { position: fixed; inset: 0; z-index: 85; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, color-mix(in srgb, var(--c) 22%, rgba(4,8,10,.75)), rgba(4,8,10,.9)); animation: ab-fadein .4s ease both; }
.crise-box { width: min(440px, 100%); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 26px 22px; border-radius: 16px; background: var(--panel); border: 1px solid var(--c); box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 50px color-mix(in srgb, var(--c) 40%, transparent); animation: crise-shake .5s .1s ease both; }
.crise-note.ok .crise-box { animation: none; }
@keyframes crise-shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
.crise-eye { font: 600 11px/1 var(--f-mono); letter-spacing: .3em; text-transform: uppercase; color: var(--c); }
.crise-note .sh-av.big { width: 76px; height: 76px; font-size: 24px; box-shadow: 0 0 0 3px var(--c); }
.crise-box h2 { margin: 0; font: 600 32px/1.1 var(--f-display); color: var(--mist); }
.crise-box p { margin: 0; color: var(--mist-2); max-width: 36ch; }
.crise-meta { font-size: 12.5px; color: var(--mist-3); }
.sh-crise { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border-radius: 8px; border-left: 3px solid var(--c); background: rgba(0,0,0,.2); }
.sh-crise b { color: var(--c); }
@media (prefers-reduced-motion: reduce) { .crise-card, .crise-box { animation: none; } }

/* ---------- ficha ao lado do mapa (jogador) ---------- */
.pl-sheet { position: absolute; top: 62px; right: 12px; bottom: 62px; width: 304px; z-index: 13; display: flex; flex-direction: column; background: rgba(17, 27, 31, 0.95); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; backdrop-filter: blur(6px); }
.app:not(.players) .pl-sheet, .app.sheets-open .pl-sheet { display: none !important; }
.pl-sheet[hidden] { display: none; }
#pl-me.on { background: rgba(233, 180, 90, 0.18); border-color: rgba(233, 180, 90, 0.5); color: var(--lamp-2); }
.ps-head { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 10px 10px 10px 12px; border-bottom: 1px solid var(--line); }
.ps-head .sh-av { width: 40px; height: 40px; }
.ps-head .sh-av img { width: 100%; height: 100%; object-fit: cover; }
.ps-nm { display: flex; flex-direction: column; min-width: 0; }
.ps-nm b { font: 600 19px/1.1 var(--f-display); color: var(--mist); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ps-nm span { font-size: 12px; color: var(--mist-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ps-scroll { flex: 1; overflow: auto; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 12px; overscroll-behavior: contain; }
.ps-meter { display: flex; flex-direction: column; gap: 6px; }
.ps-row { display: flex; align-items: center; gap: 6px; }
.ps-row .iconbtn { width: 30px; height: 30px; }
.ps-lbl { font: 600 11px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--mist-3); flex: 1; }
.ps-num { font: 600 22px/1 var(--f-mono); color: var(--mist); margin-right: 4px; }
.ps-num small { font-size: 13px; color: var(--mist-3); font-weight: 500; }
.ps-bar { height: 6px; border-radius: 99px; background: var(--panel-3); overflow: hidden; }
.ps-bar i { display: block; height: 100%; border-radius: 99px; transition: width .25s; }
.ps-pips { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 3px; }
.ps-pips i { height: 8px; border-radius: 3px; background: var(--panel-3); }
.ps-pips i.on { background: var(--c); }
.ps-stage { font-size: 12.5px; color: var(--mist-2); }
.ps-stage b { color: var(--c); }
.ps-warn { font-size: 12.5px; color: var(--danger); font-weight: 600; }
.ps-sec { display: flex; flex-direction: column; gap: 6px; }
.ps-sech { display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 600 11px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--mist-3); }
.ps-mode button { padding: 4px 8px; font-size: 12px; letter-spacing: 0; text-transform: none; }
.ps-atrs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ps-atr { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); color: var(--mist); font: 500 13.5px var(--f-ui); cursor: pointer; }
.ps-atr:hover { border-color: var(--line-2); background: var(--panel-3); }
.ps-atr b { font: 600 16px var(--f-mono); color: var(--lamp-2); }
.ps-atr.star { border-color: rgba(233, 180, 90, .55); }
.ps-arma { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; }
.ps-arma span { display: flex; flex-direction: column; font-size: 13.5px; color: var(--mist); min-width: 0; }

/* ---------- a ficha sente o estresse (painel "Minha ficha") ---------- */
.sx-panel { border-color: color-mix(in srgb, var(--ab) 60%, transparent); box-shadow: var(--shadow), 0 0 22px color-mix(in srgb, var(--ab) 22%, transparent), inset 0 0 0 1px color-mix(in srgb, var(--ab) 12%, transparent); transition: border-color .6s, box-shadow .6s; }
.sx-panel.st-0 { border-color: rgba(99, 194, 122, .5); } .sx-panel.st-1 { border-color: rgba(233, 194, 74, .6); } .sx-panel.st-2 { border-color: rgba(240, 132, 60, .65); } .sx-panel.st-3 { border-color: rgba(229, 72, 77, .7); }
.sx-panel .ps-pips i.on { background: var(--ab); box-shadow: 0 0 6px color-mix(in srgb, var(--ab) 60%, transparent); }
.sx-panel .ps-name { position: relative; display: inline-block; }
/* 1 · primeira crise: tremor leve, vinheta sutil, pulsação na barra e texto instável */
.sx-panel.st-1 { animation: sx-glow1 2.6s ease-in-out infinite, sx-tremor 7s infinite; box-shadow: var(--shadow), 0 0 26px color-mix(in srgb, var(--ab) 30%, transparent), inset 0 0 50px rgba(233, 194, 74, .08); }
.sx-panel.st-1 .ps-pips i.on { animation: sx-pip 1.6s ease-in-out infinite; }
.sx-panel.st-1 .ps-stage b, .sx-panel.st-1 .ps-name { animation: sx-unstable 3.4s steps(1) infinite; }
/* 2 · segunda crise: glitches, tremores, texto distorcido e elementos duplicados */
.sx-panel.st-2 { animation: sx-glow2 1.8s ease-in-out infinite, sx-tremor 4s infinite; box-shadow: var(--shadow), 0 0 30px color-mix(in srgb, var(--ab) 40%, transparent), inset 0 0 60px rgba(240, 100, 50, .13); }
.sx-panel.st-2 .ps-scroll { animation: sx-glitch 3.8s steps(1) infinite; }
.sx-panel.st-2 .ps-name::after, .sx-panel.st-3 .ps-name::after { content: attr(data-g); position: absolute; left: 0; top: 0; white-space: nowrap; color: color-mix(in srgb, var(--ab) 80%, transparent); transform: translate(3px, -2px); opacity: .55; pointer-events: none; animation: sx-ghost 2.2s steps(1) infinite; }
.sx-panel.st-2 .ps-atr b, .sx-panel.st-2 .ps-num { text-shadow: 2px 0 rgba(240, 90, 60, .55), -2px 0 rgba(90, 200, 255, .3); }
.sx-panel.st-2 .ps-pips i:nth-child(3n+2), .sx-panel.st-3 .ps-pips i:nth-child(2n) { transform: skewX(-24deg) scaleX(.72); }
.sx-panel.st-2 .ps-pips i.on:nth-child(4n) { animation: sx-flick 1.3s steps(1) infinite; }
/* 3 · colapso: distorção, ruído, erros, vinheta pesada e elementos desaparecendo */
.sx-panel.st-3 { animation: sx-glow3 1.1s ease-in-out infinite, sx-tremor 2.6s infinite; background: linear-gradient(rgba(60, 0, 0, .22), rgba(30, 0, 0, .35)), rgba(17, 18, 20, .96); box-shadow: var(--shadow), 0 0 36px rgba(229, 72, 77, .5), inset 0 0 80px rgba(150, 0, 0, .45); }
.sx-panel.st-3::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; z-index: 5; background: repeating-linear-gradient(0deg, rgba(255, 40, 40, .05) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 55%, rgba(80, 0, 0, .45) 100%); animation: sx-noise .35s steps(2) infinite; mix-blend-mode: screen; }
.sx-panel.st-3 .ps-scroll { animation: sx-glitch 2.2s steps(1) infinite; }
.sx-panel.st-3 .ps-name { color: #ff6a6a; text-shadow: 0 0 10px rgba(229, 72, 77, .6); }
.sx-panel.st-3 .ps-lbl, .sx-panel.st-3 .ps-sech, .sx-panel.st-3 .ps-stage { color: #e98080; }
.sx-panel.st-3 .ps-num, .sx-panel.st-3 .ps-atr b { color: #ff5d5d; text-shadow: 2px 0 rgba(255, 0, 0, .5), -2px 0 rgba(0, 200, 255, .25); }
.sx-panel.st-3 .ps-atr { border-color: rgba(229, 72, 77, .35); background: rgba(60, 10, 12, .45); }
.sx-panel.st-3 .btn.primary, .sx-panel.st-3 .btn.primary:hover { background: #c4373b; border-color: #e5484d; color: #fff; }
.sx-panel.st-3 .ps-sec:nth-of-type(odd), .sx-panel.st-3 .ps-roll:nth-child(2n) { animation: sx-fade 6s ease-in-out infinite; }
.sx-panel.st-3 .ps-dice [data-v="1d20"] { border-color: #e5484d; color: #ff6a6a; box-shadow: 0 0 12px rgba(229, 72, 77, .55); }
/* efeitos de cada crise */
.sx-panel.fx-crise .ps-dice .btn { animation: sx-shiver 2.4s infinite; }
.sx-panel.fx-crise .ps-dice .btn:nth-child(2n) { animation-delay: -1.1s; }
.ps-whisper { margin-top: 6px; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(229, 72, 77, .55); background: rgba(90, 10, 12, .55); color: #ff8080; font: 500 12.5px/1.3 var(--f-ui); text-align: center; text-shadow: 0 0 8px rgba(255, 60, 60, .5); animation: sx-whisper 6s ease-in-out infinite; }
.ps-wave { width: 100%; height: 22px; display: block; }
.ps-wave path { fill: none; stroke: var(--ab); stroke-width: 1.6; stroke-dasharray: 340; animation: sx-wave 2.8s linear infinite; filter: drop-shadow(0 0 3px var(--ab)); }
.sx-panel.fx-breath { animation: sx-breath 3.2s ease-in-out infinite; }
.sx-panel.fx-panic { animation: sx-panic 3s infinite; }

/* ---------- bandeja de dados ---------- */
.dz-back { position: fixed; inset: 0; z-index: 62; background: rgba(4, 8, 10, .55); display: grid; place-items: center; padding: 14px; }
.dz { width: min(560px, 100%); max-height: calc(100vh - 28px); overflow: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 24px 60px rgba(0, 0, 0, .55); }
.dz-head { display: flex; align-items: center; gap: 8px; }

.dz-pick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dz-die { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--mist-2); font: 600 12px var(--f-ui); cursor: pointer; transition: transform .12s, border-color .12s; user-select: none; }
.dz-die:hover { border-color: var(--line-2); transform: translateY(-2px); }
.dz-die:active { transform: scale(.94); }
.dz-die.on { border-color: rgba(233, 180, 90, .6); background: rgba(233, 180, 90, .08); color: var(--mist); }
.dz-die .dd { width: 38px; height: 38px; }
.dz-n { position: absolute; top: -7px; right: -5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px; background: var(--lamp); color: var(--lamp-ink); font: 700 12px/20px var(--f-ui); text-align: center; box-shadow: 0 2px 6px rgba(0, 0, 0, .4); }
.dd polygon:not(.ln), .dd rect, .dd circle:not(.ln) { fill: color-mix(in srgb, var(--dc) 82%, #000); stroke: color-mix(in srgb, var(--dc) 70%, #fff); stroke-width: 3; stroke-linejoin: round; }
.dd .ln { fill: none; stroke: rgba(255, 255, 255, .28); stroke-width: 2; stroke-linejoin: round; }
.dd text { fill: #fff; font-family: var(--f-mono); font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: rgba(0, 0, 0, .45); stroke-width: 4px; }

.dd.fail polygon:not(.ln) { fill: #8a1f22; stroke: #ff9a9a; filter: drop-shadow(0 0 8px rgba(255, 80, 80, .8)); }
.dz-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dz-expr { flex: 1 1 100%; min-width: 0; font: 600 18px var(--f-mono); color: var(--lamp-2); overflow-wrap: anywhere; }

/* ---------- call de voz ---------- */

/* quadro dos personagens */
.qd { position: absolute; inset: 0; z-index: 10; overflow: hidden; background: #070b0d; opacity: 0; transition: opacity 0.7s ease; }
.qd.in { opacity: 1; }
.qd.out { opacity: 0; pointer-events: none; }
.qd-fx { position: absolute; inset: 0; width: 100%; height: 100%; }
.qd-fog { position: absolute; inset: -20% -40%; pointer-events: none; opacity: 0.5; background: radial-gradient(ellipse 30% 18% at 20% 40%, rgba(210, 220, 224, 0.10), transparent 70%), radial-gradient(ellipse 26% 14% at 65% 70%, rgba(210, 220, 224, 0.08), transparent 70%), radial-gradient(ellipse 34% 16% at 85% 25%, rgba(210, 220, 224, 0.07), transparent 70%); animation: qd-drift 70s linear infinite; }
.qd-fog2 { opacity: 0.35; animation-duration: 110s; animation-direction: reverse; transform: scale(1.3); }
@keyframes qd-drift { from { transform: translateX(-12%); } to { transform: translateX(12%); } }
.qd-vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0, 0, 0, 0.65) 100%); }
.qd-in { position: absolute; inset: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: 34px 20px 120px; }
.qd-head { text-align: center; margin-bottom: 26px; }
.qd-ov { font: 600 11px/1 var(--f-ui); letter-spacing: 0.34em; text-transform: uppercase; color: var(--lamp); opacity: 0.85; }
.qd-tt { margin: 10px 0 0; font: 600 clamp(28px, 4.2vw, 46px)/1.05 var(--f-display); color: #efe7d4; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.9); }
.qd-tt::after { content: ''; display: block; width: 90px; height: 1px; margin: 14px auto 0; background: linear-gradient(90deg, transparent, var(--lamp), transparent); }
.qd-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(22px, 3.2vw, 46px) clamp(18px, 2.8vw, 40px); max-width: 1180px; width: 100%; }
.qd-card { position: relative; width: clamp(138px, 17vw, 210px); display: flex; flex-direction: column; align-items: center; opacity: 0; transform: translateY(16px); animation: qd-in 0.9s cubic-bezier(.2, .7, .2, 1) forwards; animation-delay: var(--d); }
.qd-card > .qd-frame { animation: qd-bob 7s ease-in-out infinite; animation-delay: var(--b); }
@keyframes qd-in { to { opacity: 1; transform: none; } }
@keyframes qd-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.qd-frame { position: relative; width: 100%; aspect-ratio: 4 / 5; padding: 9px; border-radius: 4px; background: linear-gradient(145deg, #7a5a2c, #3c2a12 40%, #8a6a34 70%, #3a2810); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.75), inset 0 0 0 1px rgba(255, 226, 160, 0.35), inset 0 0 0 4px rgba(20, 12, 4, 0.55); }
.qd-frame::before { content: ''; position: absolute; inset: 5px; border: 1px solid rgba(255, 222, 150, 0.45); border-radius: 2px; pointer-events: none; }
.qd-cn { position: absolute; width: 14px; height: 14px; border: 2px solid rgba(240, 205, 130, 0.75); z-index: 2; }
.qd-cn.tl { left: 2px; top: 2px; border-right: 0; border-bottom: 0; }
.qd-cn.tr { right: 2px; top: 2px; border-left: 0; border-bottom: 0; }
.qd-cn.bl { left: 2px; bottom: 2px; border-right: 0; border-top: 0; }
.qd-cn.br { right: 2px; bottom: 2px; border-left: 0; border-top: 0; }
.qd-pic { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0d1215; box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.85); }
.qd-pic img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(0.88) contrast(1.04); }
.qd-pic::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 240, 210, 0.07), transparent 35%, rgba(0, 0, 0, 0.35)); pointer-events: none; }
.qd-ini { width: 100%; height: 100%; display: grid; place-items: center; font: 600 clamp(30px, 4vw, 48px)/1 var(--f-display); color: #efe7d4; background: radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--c) 70%, #fff 0%), #10181b 90%); }
.qd-plate { margin-top: 12px; padding: 6px 14px 7px; min-width: 70%; text-align: center; border-radius: 3px; background: linear-gradient(180deg, rgba(30, 22, 12, 0.92), rgba(16, 11, 6, 0.92)); border: 1px solid rgba(233, 180, 90, 0.4); box-shadow: 0 8px 18px rgba(0, 0, 0, 0.55); }
.qd-plate b { display: block; font: 600 clamp(16px, 1.6vw, 20px)/1.1 var(--f-display); color: #f2e9d4; letter-spacing: 0.02em; }
.qd-plate span { display: block; margin-top: 2px; font: 500 11px/1.2 var(--f-ui); letter-spacing: 0.14em; text-transform: uppercase; color: #c9b48a; }
.qd-item { position: absolute; right: -24px; bottom: 74px; z-index: 3; width: 74px; display: flex; flex-direction: column; align-items: center; color: var(--ic); pointer-events: none; animation: qd-float 5.5s ease-in-out infinite; animation-delay: var(--b); }
.qd-item .qd-svg, .qd-item img { display: block; width: 64px; height: 64px; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--ic) 70%, transparent)) drop-shadow(0 0 16px color-mix(in srgb, var(--ic) 35%, transparent)); opacity: 0.88; }
.qd-item .qd-svg svg { fill: color-mix(in srgb, var(--ic) 10%, transparent); }
.qd-item img { object-fit: contain; mix-blend-mode: screen; opacity: 0.8; }
.qd-inm { margin-top: 2px; max-width: 96px; text-align: center; font: 500 10px/1.2 var(--f-ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ic); opacity: 0.8; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9); }
@keyframes qd-float { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(4deg); } }
.qd-empty { margin-top: 40px; font: 500 15px/1.5 var(--f-ui); color: #b9c3c6; text-align: center; }
.qd-gm { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 4; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 8px; border-radius: 12px; background: rgba(10, 16, 19, 0.82); border: 1px solid var(--line); backdrop-filter: blur(6px); }
.qd-peek { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 12; box-shadow: var(--shadow); }
.qd-calm .qd-fog, .qd-calm .qd-card > .qd-frame, .qd-calm .qd-item { animation: none; }
.qd-calm .qd-card { animation-duration: 0.01s; }
#qd-top.on { color: var(--lamp); }
@media (max-width: 640px) {
  .qd-in { padding: 66px 12px 150px; }
  .qd-card { width: calc(50% - 14px); max-width: 190px; }
  .qd-item { right: -6px; bottom: 66px; width: 58px; }

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* ==========================================================
   Apogeo · motor de mapas táticos (núcleo: ruído e texturas)
   1 quadrado = 1,5 m · 72 px por quadrado
   ========================================================== */
const CS = 72;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/* ---------- cor ---------- */
function hx(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function shade(h, amt) {
  const c = hx(h);
  return rgba(mixc(c, amt < 0 ? [0, 0, 0] : [255, 255, 255], Math.abs(amt)));
}
function alpha(h, a) { return rgba(hx(h), a); }

/* ---------- ruído de valor, periódico ---------- */
function lattice(px, py, seed) {
  const r = rng(seed), g = new Float32Array(px * py);
  for (let i = 0; i < g.length; i++) g[i] = r();
  return g;
}
function vnoise(g, px, py, x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const x0 = ((xi % px) + px) % px, y0 = ((yi % py) + py) % py;
  const x1 = (x0 + 1) % px, y1 = (y0 + 1) % py;
  const s = xf * xf * (3 - 2 * xf), t = yf * yf * (3 - 2 * yf);
  const a = g[y0 * px + x0], b = g[y0 * px + x1], c = g[y1 * px + x0], d = g[y1 * px + x1];
  return a + (b - a) * s + (c - a) * t + (a - b - c + d) * s * t;
}
/* fbm periódico num quadro S×S; px/py = períodos da 1ª oitava */
function fbm(S, px, py, oct, seed, gain = 0.5) {
  const out = new Float32Array(S * S);
  let amp = 1;
  for (let o = 0; o < oct; o++) {
    const qx = px << o, qy = py << o, g = lattice(qx, qy, seed + o * 131);
    const kx = qx / S, ky = qy / S;
    for (let y = 0; y < S; y++) {
      const yy = y * ky, row = y * S;
      for (let x = 0; x < S; x++) out[row + x] += vnoise(g, qx, qy, x * kx, yy) * amp;
    }
    amp *= gain;
  }
  let mn = Infinity, mx = -Infinity;
  for (let i = 0; i < out.length; i++) { const v = out[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
  const r = mx - mn || 1;
  for (let i = 0; i < out.length; i++) out[i] = (out[i] - mn) / r;
  return out;
}

function cv(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }

/* desenha fn nas cópias periódicas (para texturas sem emenda) */
function wrapDraw(S, x, y, pad, fn) {
  for (let dx = -S; dx <= S; dx += S) for (let dy = -S; dy <= S; dy += S) {
    const X = x + dx, Y = y + dy;
    if (X > -pad && X < S + pad && Y > -pad && Y < S + pad) fn(X, Y);
  }
}

/* textura natural: fbm mapeado numa rampa de cores */
function natural(S, stops, P, oct, seed, contrast = 1, jitter = 14) {
  const c = cv(S, S), x = c.getContext('2d'), img = x.createImageData(S, S);
  const n = fbm(S, P, P, oct, seed), n2 = fbm(S, P * 2, P * 2, 3, seed + 999);
  const cols = stops.map(hx), last = cols.length - 1;
  for (let i = 0; i < S * S; i++) {
    const t = clamp((n[i] - 0.5) * contrast + 0.5, 0, 0.9999);
    const f = t * last, k = Math.floor(f), col = mixc(cols[k], cols[k + 1], f - k);
    const v = (n2[i] - 0.5) * jitter, o = i * 4;
    img.data[o] = clamp(col[0] + v, 0, 255);
    img.data[o + 1] = clamp(col[1] + v, 0, 255);
    img.data[o + 2] = clamp(col[2] + v * 0.8, 0, 255);
    img.data[o + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  return c;
}
/* contornos de ruído (veios, cáusticas) */
function contours(c, S, P, oct, seed, width, color, level = 0.5, alphaMax = 1) {
  const x = c.getContext('2d'), img = x.getImageData(0, 0, S, S), n = fbm(S, P, P, oct, seed);
  const col = hx(color);
  for (let i = 0; i < S * S; i++) {
    const d = Math.abs(n[i] - level);
    if (d < width) {
      const a = (1 - d / width) * alphaMax, o = i * 4;
      img.data[o] = lerp(img.data[o], col[0], a);
      img.data[o + 1] = lerp(img.data[o + 1], col[1], a);
      img.data[o + 2] = lerp(img.data[o + 2], col[2], a);
    }
  }
  x.putImageData(img, 0, 0);
}
function speckle(c, S, n, seed, colors, rmin, rmax, alphaV = 1) {
  const x = c.getContext('2d'), r = rng(seed);
  for (let i = 0; i < n; i++) {
    const px = r() * S, py = r() * S, rr = rmin + r() * (rmax - rmin);
    x.fillStyle = colors[(r() * colors.length) | 0];
    x.globalAlpha = alphaV * (0.5 + r() * 0.5);
    wrapDraw(S, px, py, rr + 1, (X, Y) => { x.beginPath(); x.arc(X, Y, rr, 0, TAU); x.fill(); });
  }
  x.globalAlpha = 1;
}
/* Voronoi periódico: pedras irregulares */
function voronoiStones(S, count, seed, palette, gap, gapColor, edgeShade = 0.18) {
  const c = cv(S, S), x = c.getContext('2d'), img = x.createImageData(S, S), r = rng(seed);
  const pts = [];
  for (let i = 0; i < count; i++) pts.push([r() * S, r() * S, hx(palette[(r() * palette.length) | 0]), (r() - 0.5) * 22]);
  const n = fbm(S, 8, 8, 3, seed + 5), gc = hx(gapColor);
  for (let y = 0; y < S; y++) for (let X = 0; X < S; X++) {
    let d1 = 1e9, d2 = 1e9, k = 0;
    for (let i = 0; i < pts.length; i++) {
      let dx = Math.abs(X - pts[i][0]), dy = Math.abs(y - pts[i][1]);
      if (dx > S / 2) dx = S - dx; if (dy > S / 2) dy = S - dy;
      const d = dx * dx + dy * dy;
      if (d < d1) { d2 = d1; d1 = d; k = i; } else if (d < d2) d2 = d;
    }
    const e = Math.sqrt(d2) - Math.sqrt(d1), o = (y * S + X) * 4, p = pts[k];
    let col;
    if (e < gap) col = gc;
    else {
      const edge = clamp(1 - (e - gap) / 7, 0, 1) * edgeShade;
      const nv = (n[y * S + X] - 0.5) * 26 + p[3];
      col = [p[2][0] + nv, p[2][1] + nv, p[2][2] + nv];
      col = mixc(col, [0, 0, 0], edge);
    }
    img.data[o] = clamp(col[0], 0, 255); img.data[o + 1] = clamp(col[1], 0, 255); img.data[o + 2] = clamp(col[2], 0, 255); img.data[o + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  return c;
}
function grainOver(c, S, seed, amt) {
  const x = c.getContext('2d'), img = x.getImageData(0, 0, S, S), r = rng(seed);
  for (let i = 0; i < S * S; i++) {
    const v = (r() - 0.5) * amt, o = i * 4;
    img.data[o] = clamp(img.data[o] + v, 0, 255); img.data[o + 1] = clamp(img.data[o + 1] + v, 0, 255); img.data[o + 2] = clamp(img.data[o + 2] + v, 0, 255);
  }
  x.putImageData(img, 0, 0);
}

/* ---------- materiais ---------- */
const T4 = CS * 4; // 288 px = 4 quadrados

const MATS = {
  grass() {
    const S = 512, c = natural(S, ['#30521c', '#466f27', '#5f8b34', '#77a043'], 6, 5, 11, 1.25);
    const x = c.getContext('2d'), r = rng(12);
    for (let i = 0; i < 3200; i++) {
      const px = r() * S, py = r() * S, len = 3 + r() * 6, a = -Math.PI / 2 + (r() - 0.5) * 1.3;
      x.strokeStyle = r() < 0.55 ? 'rgba(28,52,16,0.38)' : 'rgba(150,190,90,0.28)';
      x.lineWidth = 1.1;
      wrapDraw(S, px, py, 10, (X, Y) => { x.beginPath(); x.moveTo(X, Y); x.lineTo(X + Math.cos(a) * len, Y + Math.sin(a) * len); x.stroke(); });
    }
    speckle(c, S, 70, 13, ['#f4f1d8', '#f2d24b', '#e9a6c2'], 1, 1.8, 0.75);
    return c;
  },
  lawn() {
    const c = MATS.grass(), x = c.getContext('2d');
    for (let i = 0; i < 4; i++) { x.fillStyle = i % 2 ? 'rgba(255,255,220,0.05)' : 'rgba(0,30,0,0.06)'; x.fillRect(i * 128, 0, 128, 512); }
    return c;
  },
  grassdk() {
    const S = 512, c = natural(S, ['#22401a', '#305523', '#41692c', '#557d35'], 6, 5, 21, 1.2);
    const x = c.getContext('2d'), r = rng(22);
    for (let i = 0; i < 2600; i++) {
      const px = r() * S, py = r() * S, len = 4 + r() * 7, a = -Math.PI / 2 + (r() - 0.5) * 1.5;
      x.strokeStyle = r() < 0.6 ? 'rgba(15,32,10,0.4)' : 'rgba(120,160,70,0.22)';
      x.lineWidth = 1.2;
      wrapDraw(S, px, py, 12, (X, Y) => { x.beginPath(); x.moveTo(X, Y); x.lineTo(X + Math.cos(a) * len, Y + Math.sin(a) * len); x.stroke(); });
    }
    return c;
  },
  forest() {
    const S = 512, c = natural(S, ['#1f2a14', '#2f3b1b', '#434a22', '#57552a'], 6, 5, 31, 1.15);
    const x = c.getContext('2d'), r = rng(32);
    const cols = ['#6b4a26', '#7d5a2c', '#4f5a24', '#8a6a2e', '#5a3c1f', '#a07a38', '#3e4a1e'];
    for (let i = 0; i < 2400; i++) {
      const px = r() * S, py = r() * S, w = 2 + r() * 4, h = 1 + r() * 2, a = r() * TAU;
      x.fillStyle = cols[(r() * cols.length) | 0]; x.globalAlpha = 0.55 + r() * 0.4;
      wrapDraw(S, px, py, 8, (X, Y) => { x.beginPath(); x.ellipse(X, Y, w, h, a, 0, TAU); x.fill(); });
    }
    x.globalAlpha = 1;
    for (let i = 0; i < 220; i++) { // gravetos
      const px = r() * S, py = r() * S, len = 8 + r() * 16, a = r() * TAU;
      x.strokeStyle = 'rgba(40,28,14,0.6)'; x.lineWidth = 1 + r();
      wrapDraw(S, px, py, 24, (X, Y) => { x.beginPath(); x.moveTo(X, Y); x.lineTo(X + Math.cos(a) * len, Y + Math.sin(a) * len); x.stroke(); });
    }
    return c;
  },
  dirt() {
    const S = 512, c = natural(S, ['#5e4229', '#76563a', '#8d6a48', '#a07c55'], 7, 5, 41, 1.1);
    speckle(c, S, 500, 42, ['#5a4a3a', '#7f7466', '#a19584', '#463628'], 0.8, 2.4, 0.8);
    return c;

/* ==========================================================
   Apogeo · mapas táticos (parte B: entrada, Parte Alta, mirante,
   prefeitura, galeria, floricultura)
   ========================================================== */
function glassFront(m, x0, x1, y, doors, o = {}) {
  // fachada de vidro horizontal com portas (centros) de largura dw
  const dw = o.dw ?? 1.4;
  let cur = x0;
  for (const dx of doors.slice().sort((a, b) => a - b)) {
    if (dx - dw / 2 > cur) m.walls([[cur, y], [dx - dw / 2, y]], { kind: 'glass' });
    m.door(dx, y, 'h', { w: dw, kind: 'glass', double: dw > 1.6, side: o.side ?? 1, t: 0.14 });
    cur = dx + dw / 2;
  }
  if (cur < x1) m.walls([[cur, y], [x1, y]], { kind: 'glass' });
}

  const r0 = o.r ?? 1.2;
  sh(ctx, 0.12, 0.5); circ(ctx, 0, 0, r0 * 1.08, '#4a4036'); nosh(ctx);
  circ(ctx, 0, 0, r0 * 1.08, null, '#c9a24a', 0.06);
  for (let i = 0; i < 6; i++) { const rr0 = r0 * (1 - i * 0.15); circ(ctx, 0, 0, rr0, i % 2 ? 'rgba(210,236,240,0.55)' : 'rgba(170,214,226,0.6)', 'rgba(255,255,255,0.55)', 0.018); }
  for (let i = 0; i < 8; i++) { const a = (i / 8) * TAU; line(ctx, Math.cos(a) * r0 * 0.25, Math.sin(a) * r0 * 0.25, Math.cos(a) * r0, Math.sin(a) * r0, 'rgba(201,162,74,0.85)', 0.035); }
  circ(ctx, 0, 0, r0 * 0.24, '#fff6d8', '#c9a24a', 0.03);
  glowAt(ctx, 0, 0, r0 * 2.6, '#fff1c0', 0.35);
};

PROPS.rails = function (ctx, o) { // trecho reto de trilho (comprimento em h)
  const h = o.h ?? 2, g = 0.32;
  for (let y = -h / 2 + 0.12; y < h / 2; y += 0.36) { ctx.fillStyle = '#4a3220'; ctx.fillRect(-0.5, y - 0.07, 1, 0.14); ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(-0.5, y + 0.04, 1, 0.03); }
  for (const x of [-g, g]) { line(ctx, x, -h / 2, x, h / 2, '#3a3a3c', 0.075); line(ctx, x - 0.012, -h / 2, x - 0.012, h / 2, '#a9adb2', 0.03); }
};
PROPS.minecart = function (ctx, o, r) {
  const w = o.w ?? 0.9, h = o.h ?? 1.25;
  for (const [x, y] of [[-w / 2, -h * 0.3], [w / 2, -h * 0.3], [-w / 2, h * 0.3], [w / 2, h * 0.3]]) { ctx.fillStyle = '#1e1e20'; ctx.fillRect(x - 0.06, y - 0.12, 0.12, 0.24); }
  sh(ctx, 0.08, 0.5); rr(ctx, -w / 2, -h / 2, w, h, 0.06); ctx.fillStyle = '#5b6066'; ctx.fill(); nosh(ctx);
  ctx.strokeStyle = OUT; ctx.lineWidth = 0.025; ctx.stroke();
  rr(ctx, -w / 2 + 0.08, -h / 2 + 0.08, w - 0.16, h - 0.16, 0.04); ctx.fillStyle = '#26282b'; ctx.fill();
  if (o.coal !== false) for (let i = 0; i < 14; i++) { const x = (r() - 0.5) * (w - 0.24), y = (r() - 0.5) * (h - 0.24), q = 0.06 + r() * 0.06; circ(ctx, x, y, q, r() < 0.3 ? '#3c3e44' : '#18181a'); }
  for (const x of [-w / 2 + 0.03, w / 2 - 0.03]) line(ctx, x, -h / 2 + 0.05, x, h / 2 - 0.05, 'rgba(160,110,60,0.6)', 0.03);
};
PROPS.beam = function (ctx, o) { // escora de madeira atravessando a galeria
  const w = o.w ?? 2.4;
  sh(ctx, 0.06, 0.45); ctx.fillStyle = '#6b4a2e'; ctx.fillRect(-w / 2, -0.1, w, 0.2); nosh(ctx);
  line(ctx, -w / 2, -0.1, w / 2, -0.1, 'rgba(255,220,170,0.18)', 0.02); ctx.strokeStyle = OUT; ctx.lineWidth = 0.015; ctx.strokeRect(-w / 2, -0.1, w, 0.2);

};
PROPS.coal = function (ctx, o, r) { // monte de carvão
  const R0 = o.r ?? 0.7, n = Math.round(30 * R0 * R0) + 10;
  sh(ctx, 0.05, 0.5); ctx.beginPath(); ctx.ellipse(0, 0, R0, R0 * 0.8, 0, 0, TAU); ctx.fillStyle = '#121214'; ctx.fill(); nosh(ctx);
  for (let i = 0; i < n; i++) { const a = r() * TAU, d = Math.sqrt(r()) * R0 * 0.95; const x = Math.cos(a) * d, y = Math.sin(a) * d * 0.8, q = 0.05 + r() * 0.09; circ(ctx, x, y, q, r() < 0.25 ? '#34363c' : r() < 0.5 ? '#1c1c20' : '#26272b'); if (r() < 0.12) circ(ctx, x - q * 0.3, y - q * 0.3, q * 0.25, 'rgba(200,210,230,0.35)'); }

  circ(ctx, s * 0.18, 0, 0.18, '#3a3a3c', OUT, 0.02);

/* trilho seguindo uma linha (vários trechos retos) */
function track(m, pts) {
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[i + 1], dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy);
    m.o('rails', (ax + bx) / 2, (ay + by) / 2, { h: L + 0.08, rot: (Math.atan2(-dx, dy) * 180) / Math.PI });
  }
}

}

/* ---------- imagens ---------- */
function fileToImage(file) {
  return new Promise((res, rej) => { const url = URL.createObjectURL(file), img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error('Não consegui ler essa imagem.')); img.src = url; });
}

    const c = cv(w, hh); c.getContext('2d').drawImage(img, 0, 0, w, hh);
    blob = await new Promise(r => c.toBlob(r, 'image/jpeg', ASSETS ? 0.9 : 0.82));
  }
  if (ASSETS) {
    try { const res = await ASSETS.upload(blob, { type: blob.type || 'image/jpeg' }); return { ref: res.id, iw: w, ih: hh }; }
    catch (e) {
      const m = { too_large: 'A imagem é grande demais (máximo 20 MB).', unsupported_type: 'Esse tipo de arquivo não é aceito. Use JPG, PNG ou WebP.', quota_or_state: 'O espaço de imagens da mesa acabou.', rate_limited: 'Muitos envios seguidos. Espere um pouco e tente de novo.' };
      throw new Error(m[e?.code] || 'Não foi possível enviar a imagem agora.');
    }

}
async function replaceImage(id, file) {

  });

    const b = e.target.closest('button'); if (!b || !root.contains(b)) return;

    if (b.dataset.mode) { Sheets.opt.mode = b.dataset.mode; Sheets.derived(); return; }
    if (b.dataset.rp != null) { Sheets.opt.rp = +b.dataset.rp; Sheets.derived(); return; }
    const act = b.dataset.act;
    if (act === 'map') { Sheets.hide(); return; }
    if (act === 'clearrolls') {
      if (ROLE !== 'gm') return;
      if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Toque de novo para limpar'; setTimeout(() => { if (b.isConnected) { b.dataset.armed = ''; b.textContent = 'Limpar'; } }, 4000); return; }

      const id = gmNew ? uid(tipo === 'pj' ? 'pf' : tipo === 'npc' ? 'npc' : 'ini') : ME;
      Sheets.data[id] = normSheet(Object.assign({ cor: tipo === 'inimigo' ? '#d0604f' : tipo === 'npc' ? '#9fb0b3' : TOKEN_COLORS[Object.keys(Sheets.data).length % (TOKEN_COLORS.length - 1)], criado: Date.now() }, tipo === 'pj' ? {} : { tipo, atitude: tipo === 'inimigo' ? 'hostil' : 'neutro', visivel: false }));

      setTimeout(() => $('#sh-nome')?.focus(), 30); return;
    }
    if (!s) return;
    if (Crise.mustRoll() && Sheets.cur === ME && act !== 'crise1' && (b.dataset.test || b.dataset.step || b.dataset.power || b.dataset.adr || b.dataset.use || ['surto', 'rest', 'scene', 'place'].includes(act))) { Crise.first(); return; }

      const entry = Sheets.test(s, b.dataset.test);
      if (cw) { Sheets.log(s, entry); commit(s, 0); }

    }

    if (b.dataset.step) {
      const path = b.dataset.step, d = +b.dataset.d;

      else if (path === 'estresse') Sheets.setEstresse(s, s.estresse + d);

      else if (path.startsWith('atr.')) { const k = path.slice(4), cv0 = vidaAt(s), was = vidaMax(s); s.atr[k] = clampI(s.atr[k] + d, 0, atrMax(s)); if (k === 'corpo' && s.vida != null) s.vida = clampI(cv0 + (vidaMax(s) - was), 0, vidaMax(s)); }

    }
    if (b.dataset.destaque) { const k = b.dataset.destaque; s.destaque = s.destaque === k ? '' : k; if (s.destaque && s.atr[k] < 4) s.atr[k] = 4; commit(s, 0); return; }
    if (b.dataset.cor) { s.cor = b.dataset.cor; Sheets.syncToken(s); commit(s, 0); return; }
    if (b.dataset.power) {
      const t = b.dataset.power, cost = t === 'm' ? 2 : 4, P = POWERS[s.destaque]; if (!P) return;
      const key = t === 'm' ? 'moderado' : 'forte'; if (s.usos[key]) return;

      s.usos[key] = true; Sheets.setEstresse(s, s.estresse - cost);
      Sheets.log(s, { l: 'Usou ' + P[t][0], txt: `−${cost} Estresse` }); commit(s, 0); return;
    }
    if (b.dataset.adr) {
      if (s.usos.adrenalina) return;
      if (b.dataset.adr === 'carne') { const v = Math.max(3, rollDie(6)); Sheets.setVida(s, vidaAt(s) - v); Sheets.log(s, { l: 'Adrenalina: sacrifício de Carne', total: v, txt: `−${v} de Vida` }); }
      else { const v = rollDie(4) + 1; Sheets.setEstresse(s, s.estresse - v); Sheets.log(s, { l: 'Adrenalina: sacrifício de Mente', total: v, txt: `−${v} de Estresse` }); }
      s.usos.adrenalina = true; UI.toast('Adrenalina ativa. Escolha o tipo e narre.'); commit(s, 0); return;
    }
    if (b.dataset.use) {
      const u = b.dataset.use;
      if (u === 'cigarro' && !s.usos.cigarro) { s.usos.cigarro = true; Sheets.setEstresse(s, s.estresse + 1); Sheets.log(s, { l: 'Acendeu um cigarro', txt: '+1 Estresse' }); }
      if (u === 'calmante' && s.doses > 0) { const v = rollDie(4); s.doses -= 1; Sheets.setEstresse(s, s.estresse + v); Sheets.log(s, { l: 'Tomou um calmante', total: v, txt: `+${v} Estresse · Desvantagem em Reação até o fim da cena` }); }

      commit(s, 0); return;
    }
    if (act === 'surto') { const entry = Sheets.surto(s); if (entry) Sheets.log(s, entry); commit(s, 0); return; }
    if (act === 'nosurto') { s.surto = ''; commit(s, 0); return; }
    if (act === 'crise') { Crise.open(Sheets.cur); return; }
    if (act === 'crise1') { Crise.playerRoll(); return; }
    if (act === 'crisefim') { s.crise = null; commit(s, 0); return; }
    if (act === 'scene') { s.usos = { moderado: false, forte: false, adrenalina: false, cigarro: false }; UI.toast('Nova cena: poderes, Adrenalina e itens liberados.'); commit(s, 0); return; }
    if (act === 'rest') { Sheets.setEstresse(s, s.estresse + 3); Sheets.setVida(s, vidaAt(s) + 2); Sheets.log(s, { l: 'Noite de descanso', txt: '+3 Estresse, +2 Vida' }); commit(s, 0); return; }
    if (act === 'photo') { $('#sh-file')?.click(); return; }
    if (act === 'place') {
      if (ROLE !== 'gm' && TRAVAS().pecas) { UI.toast('O mestre travou as peças agora.'); return; }
      Sheets.hide(); placeSheet(Sheets.cur);
      UI.renderAll(); UI.toast(`${shName(s)} entrou no mapa ${mapName(CUR)}.`); return;
    }
    if (act === 'find') {
      const t = s.token && getToken(s.token); if (!t) return;
      if (ROLE !== 'gm') { if (t.map !== CUR) { UI.toast(`Sua peça está em ${mapName(t.map)}.`); return; } Sheets.hide(); if (!mapLocked()) { PL_FOLLOW = false; centerOn(t.x, t.y); UI.renderPlayerChrome(); } return; }
      Sheets.hide();

      UI.toast('Ficha excluída.'); Sheets.refresh(); return;
    }
  });
}

function abPaletteFrom(main, alt) {

/* imagem enviada pelo mestre vira silhueta clara e translúcida */
async function qdItemFromFile(file) {

  x.drawImage(img, (S - w) / 2, (S - hh) / 2, w, hh);

  // fundo claro e liso (foto de objeto em fundo branco) vira transparente

    let al = a[i + 3] / 255; if (bgLight) al *= Math.min(1, (1 - l) * 3.2);

  if (url.length > 160000) return c.toDataURL('image/webp', 0.85);
  return url;
}

/* ---------- relógio da campanha: a luz de cada mapa segue a hora ---------- */
const SUBSOLO = new Set(['mina-subterranea', 'monumento-subsolo', 'mansao-porao']);

}

  }));

/* ---------- permissão do mestre para criar ficha ---------- */
const Pedidos = {

        for (const ch of snap.docChanges()) { if (ch.type === 'removed') delete this.list[ch.doc.id]; else this.list[ch.doc.id] = ch.doc.data(); }

      this.rolling = false;
      const detail = res.parts.map((p, i) => (i ? (p.sign < 0 ? ' − ' : ' + ') : p.sign < 0 ? '−' : '') + (p.type === 'num' ? p.n : `${p.n}d${p.sides} [${p.vals.join(', ')}]`)).join('');
      const nat20 = dice.some(d => d.sides === 20 && d.v === 20), nat1 = dice.some(d => d.sides === 20 && d.v === 1);
      const resHtml = `<b class="dz-total${nat20 ? ' crit' : nat1 ? ' fail' : ''}">${res.total}</b><span>${esc(detail)}</span>`;
      $('#dz-result') && ($('#dz-result').innerHTML = resHtml);
      this.last = { html: tray.innerHTML, res: resHtml };
      this.hist = [{ total: res.total, expr: normExpr(expr) }, ...this.hist].slice(0, 6);
      this.publish(expr, res);
      const go = this.box?.querySelector('.dz-go'); if (go) go.disabled = false;
      const hist = this.box?.querySelector('.dz-hist'); if (hist) hist.innerHTML = this.hist.map(r => `<span><b>${esc(String(r.total))}</b> ${esc(r.expr)}</span>`).join('');
      else if (this.box) this.box.insertAdjacentHTML('beforeend', `<div class="dz-hist">${this.hist.map(r => `<span><b>${esc(String(r.total))}</b> ${esc(r.expr)}</span>`).join('')}</div>`);
    });
    const go = this.box.querySelector('.dz-go'); if (go) go.disabled = true;
  },
  /* manda a rolagem para a mesa do mesmo jeito que as outras */
  publish(expr, res) {
    const why = (this.who() + ' · dados').slice(0, 60);
    const r = { id: uid('r'), expr: normExpr(expr), why, total: res.total, parts: res.parts, success: res.success, t: Date.now(), secret: false };
    if (ROLE !== 'gm' && ME && Sheets.data?.[ME]) Object.assign(r, rollMeta(ME), { lbl: 'dados' });
    ROLLS_SEEN.add(r.id);
    if (ROLE === 'gm' && Store.writable) {
      if (this.secret) { r.secret = true; SECRET_ROLLS.unshift(r); SECRET_ROLLS = SECRET_ROLLS.slice(0, 30); LS.set('secretRolls', SECRET_ROLLS); }
      else { const list = [r, ...(Store.data.vtt.rolls?.list || [])].slice(0, 20); Store.put('vtt/rolls', { list }, 0); Live.emit('roll', r); }
      if (UI.tab === 'dados') UI.renderRightSoon();
    } else {
      try { Live.bc?.postMessage({ topic: 'roll', data: r }); } catch {}
      try { Live.room?.emit('roll', r).catch(() => {}); } catch {}
      const s = ME && Sheets.data?.[ME];
      if (s && Sheets.canWrite(ME)) { Sheets.log(s, { l: 'Rolou ' + normExpr(expr), total: res.total, expr: normExpr(expr), parts: res.parts }); Sheets.save(ME, 0); PlSheet.renderSoon(); }
    }
  },
  /* barulhinho de dados na mesa */
  sound(n) {
    const ac = Som.ctx(); if (!ac || Som.mudo || REDUCED) return;
    if (ac.state !== 'running') ac.resume().catch(() => {});
    const t0 = ac.currentTime + 0.05, buf = ac.createBuffer(1, ac.sampleRate * 0.05, ac.sampleRate), a = buf.getChannelData(0);
    for (let i = 0; i < a.length; i++) a[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / a.length, 3);
    const hits = Math.min(14, 4 + n * 2);
    for (let i = 0; i < hits; i++) {
      const t = t0 + 0.25 + Math.random() * 0.9 * (i / hits + 0.2), src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 1800 + Math.random() * 2600; f.Q.value = 3; g.gain.value = (0.25 + Math.random() * 0.3) * Som.vol;
      src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t);
    }
  },
};
