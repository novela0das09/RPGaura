/* ---------- reações a mudanças ---------- */
function wireStore() {
  Store.on((path, val, origin) => {
    const [b, k] = splitPath(path);
    if (b === 'maps') {
      Som.autoSoon(); Som.paneSoon();
      if (k === CUR && WORLD_INFO) {
        const prev = WORLD_INFO; refreshWorldInfo();
        if (origin === 'remote') {
          if ((prev.src || '') !== (WORLD_INFO.src || '') || prev.kind !== WORLD_INFO.kind) loadMapIntoWorld(CUR).then(() => fitView());
          else { drawGrid(); drawLabels(); Night.draw(); Mist.update(); Wx.update(); Cal.render(); if (Input.mode !== 'light') drawLightMarks(); if (Input.mode !== 'vertex' && Input.mode !== 'areadrag') drawHotspots(); if (Input.mode !== 'fog' && Input.mode !== 'fogrect') Fog.applyRemote(WORLD_INFO.fog); }
        }
      }
      if (origin === 'remote') { UI.renderLeftSoon(); UI.renderRightSoon(); UI.renderTopSoon(); if (!mapExists(CUR)) goTo(CITY_ID); }
    } else if (b === 'hinit') {
      Init.renderSoon();
    } else if (b === 'tokens' || b === 'htokens') {
      if (origin === 'remote') ensureOwnersSoon();
      if (Init.get().on) Init.renderSoon();
      if (!(Input.mode === 'token' && Input.tok?.id === k)) drawTokens();
      if (Sheets.open) refreshSheetsSoon();
      if (origin === 'remote') { UI.renderRightSoon(); UI.renderLeftSoon(); }
    } else if (b === 'notes') {
      if (origin === 'remote') Notas.remote(k, val);
    } else if (b === 'sons') {
      Som.applySoon(); Som.preloadSoon(); if (ROLE === 'gm') Som.autoSoon();
      Som.paneSoon();
    } else if (b === 'mural' || b === 'hmural') {
      if (Mural.open) Mural.renderSoon();
    } else if (b === 'vtt') {
      if (k === 'scene') { onScene(val); Som.autoSoon(); Som.paneSoon(); }
      if (k === 'audio') { Som.applySoon(); Som.paneSoon(); }
      if (k === 'init') Init.renderSoon();
      if (k === 'cal') { afterLights(); if (ROLE === 'gm') Som.autoSoon(); if (UI.tab === 'mapa' && origin === 'remote') UI.renderRightSoon(); }
      if (k === 'sonsauto') { Som.autoSoon(); Som.paneSoon(); }
      if (k === 'travas') onTravas();
      if (k === 'quadro') Quadro.syncSoon();
      if (k === 'abertura') { Abertura.renderBtn(); if (origin === 'remote' && val && val.ativa === false && Abertura.on && ROLE !== 'gm') Abertura.close(); }
      if (k === 'rolls' && origin === 'remote') onRolls(val);
      if (k === 'mural') { if (origin === 'remote') Mural.onRemote(val); else if (Mural.open) Mural.renderHeadSoon(); }
    }
  });
  setTimeout(() => Quadro.sync(), 1200);
  setTimeout(() => Notas.restore(), 2500);
  Live.on('scene', d => { if (VIEWMODE === 'players' && d && typeof d.map === 'string' && mapExists(d.map) && d.map !== CUR) goTo(d.map, { noScene: true }); });
  Live.on('cam', d => { if (VIEWMODE === 'players' && PL_FOLLOW && d && d.map === CUR && !Input.loading) applyCamRect(d.r); });
  Live.on('tok', d => {
    if (!d || d.map !== CUR || typeof d.x !== 'number' || typeof d.y !== 'number') return;
    const el = TOKEL.get(String(d.id));
    if (el && !el.classList.contains('dragging')) { el.style.left = d.x + 'px'; el.style.top = d.y + 'px'; el.hidden = VIEWMODE !== 'gm' && Fog.fogged(d.x, d.y); if (Night.on) Night.drawSoon(); }
  });
  Live.on('fog', d => { if (!d || d.map !== CUR || Input.mode === 'fog' || Input.mode === 'fogrect') return; Fog.applyRemote(d); });
  Live.on('ping', d => { if (d && d.map === CUR && isFinite(d.x) && isFinite(d.y)) showPing(+d.x, +d.y, String(d.id || '')); });
  Live.on('intro', d => Abertura.onRemote(d));
  Live.on('crise', d => Crise.onLive(d));
  const SFX_N = new Set();
  Live.on('sfx', d => { if (d?.n) { if (SFX_N.has(d.n)) return; SFX_N.add(d.n); } if (d?.to && !somOuvePriv(String(d.to))) return; if (d?.stop) { if (d.to) Som.privStopOnes(String(d.to)); else Som.stopOnes(); } else if (d?.id) { if (d.to) Som.privOnce(String(d.id), String(d.to)); else Som.once(String(d.id), true); } });
  Live.on('roll', d => { if (d && d.id && !ROLLS_SEEN.has(d.id)) { ROLLS_SEEN.add(d.id); if (ROLE === 'gm') { SECRET_ROLLS.unshift(Object.assign(sanitizeRoll(d), { secret: true })); SECRET_ROLLS = SECRET_ROLLS.slice(0, 30); LS.set('secretRolls', SECRET_ROLLS); } if (ROLE === 'gm') RollFeed.push(sanitizeRoll(d)); else UI.rollToast(sanitizeRoll(d)); if (UI.tab === 'dados') UI.renderRightSoon(); } });
}

/* ---------- inicialização ---------- */
async function boot(hot) {
  buildShell(); wireSheets(); wireArmas(); wireInit(); wireMural(); setWide(WIDE);
  vp = $('#viewport'); world = $('#world'); stage = $('#stage');
  buildWorld(); bindInput();
  ROLE = 'loading';
  await loadMapIntoWorld(CITY_ID); fitView();
  const hasRT = typeof window.claude?.use === 'function';
  let db = null, user = null, room = null, assets = null;
  if (hasRT) {
    UI.loading(true, 'Conectando à mesa…');
    const use = n => Promise.race([Promise.resolve().then(() => window.claude.use(n)).catch(() => null), sleep(12000).then(() => null)]);
    [db, user] = await Promise.all([use('db'), use('user')]);
    if (db) [room, assets] = await Promise.all([use('room'), use('assets')]);
    UI.loading(false);
  }
  let gm;
  if (db) {
    gm = user ? !!(await Promise.resolve(user.isOwner()).catch(() => false)) : false;
    try { ME = user ? await user.id() : null; } catch { ME = null; }
    PLAYER_CAN = !gm && !!ME && !!(user && await Promise.resolve(user.canEdit()).catch(() => false));
    PASSETS = PLAYER_CAN ? assets : null;
  }
  else gm = !hasRT;
  ROLE = gm ? 'gm' : 'player';
  ASSETS = gm ? assets : null;
  wireStore();
  if (db) { UI.loading(true, 'Abrindo a mesa…'); await Store.initDb(db, gm); UI.loading(false); }
  else Store.initLocal();
  Store.writable = gm;
  $('#app').classList.remove('booting');
  for (const r of Store.data.vtt.rolls?.list || []) if (r?.id) ROLLS_SEEN.add(r.id);
  Live.init(room);
  try { Voice.init(); } catch (e) { console.warn('call', e); }
  PlSheet.wire();
  Abalo.watch();
  setTimeout(() => { ensureOwners(); onTravas(); }, 3500); setInterval(ensureOwners, 30000);
  Sheets.init(db);
  Pedidos.init(db);
  VIEWMODE = gm ? (hot.viewmode || SS.get('view', 'gm')) : 'players';
  $('#app').classList.toggle('players', VIEWMODE === 'players');
  if (VIEWMODE === 'players') {
    const sc = Store.data.vtt.scene;
    const target = sc?.map && mapExists(sc.map) ? sc.map : CITY_ID;
    await goTo(target, { quiet: true, noScene: true, cam: sc?.cam });
    if (target === CITY_ID && !sc?.cam) fitView();
  } else {
    const want = hot.cur || SS.get('cur', CITY_ID);
    const target = mapExists(want) ? want : CITY_ID;
    await goTo(target, { quiet: true, noScene: true, trail: hot.trail || SS.get('trail', null) || undefined });
    if (hot.view && hot.cur === target) { View.x = hot.view.x; View.y = hot.view.y; View.z = hot.view.z; applyView(); }
    if (hot.tab) UI.tab = hot.tab;
    setTool(hot.tool && hot.tool !== 'areas' ? hot.tool : 'move');
  }
  UI.renderAll(); UI.renderViewSwitch();
  Som.apply(); Som.autoSoon(); setTimeout(() => Som.preload(), 400);
  Init.render();
  if (hot.sheet) Sheets.show(hot.sheet === true ? null : hot.sheet);
  if (!db && hasRT) {
    const box = $('#toasts');
    const card = h('div', { class: 'toast', id: 'visitor-card', role: 'status', style: { flexDirection: 'column', alignItems: 'flex-start', gap: '8px' } },
      h('span', null, 'Não foi possível conectar ao banco de dados da mesa. Recarregue a página.'),
      h('button', { class: 'btn sm', type: 'button', onclick: () => pickMode('gm') }, 'Usar como mesa só neste navegador'));
    box.append(card);
  }
  try { window.claude?.hot?.snapshot?.(() => ({ cur: CUR, trail: TRAIL, view: { x: View.x, y: View.y, z: View.z }, tool: TOOL, tab: UI.tab, viewmode: VIEWMODE, sheet: Sheets.open ? (Sheets.cur || true) : null })); } catch {}
}
function startApp(data) { boot(data && typeof data === 'object' ? data : {}).catch(e => { console.error(e); UI.toast('Algo deu errado ao abrir a mesa: ' + (e?.message || e), 'err'); }); }
if (window.APOGEU_FB?.ready) window.APOGEU_FB.gate(() => startApp({}));
else if (window.APOGEU_FB) window.APOGEU_FB.setup(() => startApp({}));
else startApp({});
